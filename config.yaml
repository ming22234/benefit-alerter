# ==========================================================
# 🎯 맞춤형 혜택(지원금·바우처·적금) 일일 알림 봇 설정 파일
# ==========================================================

# 1. 내 기본 조건 (맞춤 필터링 기준)
profile:
  birth_year: 1994                  # 출생연도 (현재 연도 기준으로 만 나이 자동 계산)
  region_sido: "경기"                # 거주 시/도 (예: "서울", "경기", "부산", "인천" 등)
  region_sigungu: "수원시 영통구"     # 거주 시/군/구 ( 경기도 + 수원시 + 영통구 혜택 모두 매칭)
  include_nationwide: true          # 전국 공통 혜택 포함 여부 (true 권장)
  include_age_unrestricted: true    # 연령 제한 없는 혜택 포함 여부 (true 권장)

# 2. 관심 카테고리 및 키워드 설정
interests:
  # 수집할 분야 활성화 여부
  categories:
    education_voucher: true         # 교육/자기계발 바우처 (평생교육이용권, 내일배움카드, 문화누리카드 등)
    youth_finance: true             # 청년 적금/금융/자산형성 (청년도약계좌, 청년내일저축계좌, 기후동행/K-패스 등)
    housing_living: true            # 주거/월세/생활안정 지원금 (청년월세지원, 전세보증금반환보증 등)
    local_gov_subsidy: true         # 내 거주지 지자체 지원사업 (자격증 응시료, 면접수당, 어학시험비 등)
    private_scholarship: true       # 민간 기업/재단 장학금, 무료 교육, 대외활동 혜택

  # 최우선 알림 키워드 (제목/내용에 포함되면 상단 '⭐ 핵심 관심 혜택'으로 강조 표시)
  priority_keywords:
    - "평생교육"
    - "바우처"
    - "이용권"
    - "적금"
    - "계좌"
    - "월세"
    - "장학"
    - "응시료"
    - "지원금"
    - "문화누리"
    - "내일배움"

  # 제외할 키워드 (나와 무관한 공고 노이즈 제거용)
  exclude_keywords:
    - "농업인"
    - "어업인"
    - "축산"
    - "임업"
    - "경로당"
    - "참전유공자"

# 3. 알림 발송 옵션
notification:
  channel: "telegram"               # 알림 채널 ("telegram")
  closing_soon_days: 3              # 마감 임박 기준 일수 (D-3 이내면 마감 임박 섹션에 표시)
  send_empty_alert: true            # 신규 혜택이 없는 날에도 '현재 신청 가능한 혜택 요약'을 보낼지 여부
  max_other_items_in_message: 20    # '기타 현재 신청 가능 혜택' 섹션에 표시할 최대 개수
