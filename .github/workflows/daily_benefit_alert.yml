name: Daily Benefit Alert Bot

on:
  schedule:
    # 매일 오전 08:30 KST (UTC 23:30) 자동 실행
    - cron: '30 23 * * *'
  workflow_dispatch: # GitHub 웹/CLI에서 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  send-benefit-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Korean fonts & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install -r requirements.txt

      - name: Run Benefit Collector, Blog Generator & Notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          PYTHONPATH=. python src/main.py

      - name: Commit updated history and generated blog post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_history.json data/blog_history.json data/latest_preview.md blog_posts/
          git diff --staged --quiet || git commit -m "chore: update daily benefit & blog history"
          git push
